app:
  name: busy_bee
  env: dev
  random_state: 42
  log_level: INFO

api:
  title: Busy Bee API
  version: 0.1.0

data:
  train_path: data/raw/customers.csv
  target_column: churn
  test_size: 0.2

model:
  type: random_forest
  params:
    n_estimators: 100
    max_depth: 8
    min_samples_split: 2
    random_state: 42

artifacts:
  model_dir: models/artifacts
  model_file: busy_bee_model.joblib
  metrics_file: metrics.json
  registry_file: registry.json

governance:
  require_human_approval_for_financial_execution: true
  audit_enabled: true

strategic_cycle:
  enabled: true
  max_recommendations: 5
